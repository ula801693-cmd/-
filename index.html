<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крапковий Світ: Впізнай Героя!</title>
    <!-- Підключення дитячого та яскравого шрифту -->
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. СТИЛІ ТА ТЕМА ПУАНТИЛІЗМУ (CSS)
           ========================================================================== */
        
        :root {
            --primary-bg: #f8f3ff;
            --card-border: #8a4fff;
            --correct-color: #2ec4b6;
            --wrong-color: #ff9f1c;
            --error-color: #e71d36;
            --text-color: #2b2d42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--primary-bg);
            /* ФОН У СТИЛІ ПУАНТИЛІЗМУ: Мереживо з кольорових крапок */
            background-image: 
                radial-gradient(#ff9f1c 20%, transparent 20%),
                radial-gradient(#2ec4b6 20%, transparent 20%),
                radial-gradient(#ffbf69 15%, transparent 15%),
                radial-gradient(#8a4fff 15%, transparent 15%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px, 15px 45px, 45px 15px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Головний контейнер гри */
        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 35px;
            padding: 30px;
            max-width: 850px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(138, 79, 255, 0.25);
            border: 8px dashed #8a4fff;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Заголовок у стилі крапок */
        h1 {
            font-family: 'Comfortaa', cursive;
            color: #6c5ce7;
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px #ffeaa7;
        }

        /* Прогрес-бар */
        .progress-container {
            background: #dfe6e9;
            border-radius: 20px;
            height: 16px;
            width: 80%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 3px solid #6c5ce7;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff7675, #fdcb6e, #55efc4, #74b9ff);
            background-size: 30px 30px;
            /* Ефект точкового градієнта */
            background-image: radial-gradient(circle, rgba(255,255,255,0.8) 20%, transparent 20%);
            transition: width 0.4s ease;
        }

        /* Опис завдання */
        .riddle-box {
            background: #f1f2f6;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            border: 4px solid #a29bfe;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .riddle-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3436;
            line-height: 1.5;
        }

        /* Сітка карток з варіантами відповідей */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        /* Картка із зображенням */
        .option-card {
            background: #ffffff;
            border: 5px solid #a29bfe;
            border-radius: 25px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Ефект "мерехтіння крапок" при наведенні */
        .option-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #6c5ce7;
            box-shadow: 0 12px 25px rgba(108, 92, 231, 0.3);
        }

        .option-card:hover::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#fdcb6e 30%, transparent 30%);
            background-size: 15px 15px;
            opacity: 0.2;
            pointer-events: none;
            animation: pointillism-flicker 0.6s infinite alternate;
        }

        @keyframes pointillism-flicker {
            0% { opacity: 0.1; transform: scale(1); }
            100% { opacity: 0.3; transform: scale(1.05); }
        }

        .option-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            display: block;
            margin-bottom: 10px;
            border: 2px solid #dfe6e9;
        }

        .option-title {
            font-size: 1.1rem;
            font-weight: 900;
            color: #2d3436;
        }

        /* Класи підсвічування відповідей */
        .option-card.correct {
            border-color: var(--correct-color) !important;
            background-color: #e8f8f5;
            animation: bounce 0.5s ease;
        }

        .option-card.wrong {
            border-color: var(--error-color) !important;
            background-color: #ffe6e6;
            animation: shake 0.4s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* Фінальний екран перемоги */
        .final-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .final-title {
            font-size: 2.2rem;
            color: #6c5ce7;
            margin-bottom: 15px;
        }

        .dot-badge {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle, #fdcb6e, #e84393, #6c5ce7);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            margin: 20px 0;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border: 6px solid #fff;
        }

        /* Кнопка повтору */
        .btn-restart {
            background: #6c5ce7;
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(108, 92, 231, 0.4);
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-restart:hover {
            background: #a29bfe;
            transform: scale(1.05);
        }

        /* Адаптивність для мобільних пристроїв */
        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
            h1 { font-size: 1.6rem; }
            .riddle-text { font-size: 1rem; }
            .option-card img { height: 110px; }
        }
    </style>
</head>
<body>

    <div class="game-card">
        <!-- ЕКРАН ГРИ -->
